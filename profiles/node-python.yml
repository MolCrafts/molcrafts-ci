# molvis. Selected by CI_PROFILE=node-python. No commit SHA.
name: node-python
gates:
  - id: workflows
    stage: pre-commit
    workflow: lint
    run: molci:workflows
  - id: biome
    stage: pre-commit
    workflow: lint
    setup: [node]
    run: npx biome check
  - id: guards
    stage: pre-commit
    workflow: lint
    setup: [node-no-install, python, partners]
    run: |
      npm run check:molrs-gateway
      npm run check:versions
      uv lock --check --project python
  - id: typecheck
    stage: pre-commit
    workflow: lint
    setup: [node]
    run: npm run typecheck
  - id: test-core
    stage: pre-commit
    workflow: lint
    setup: [node]
    run: npm run test:core
  - id: js
    stage: pre-push
    workflow: test
    setup: [node]
    run: npm run test:js
  - id: vsc-ext
    stage: pre-push
    workflow: test
    setup: [node]
    run: npm run build:vsc-ext && npm run test:vsc-ext
  - id: python
    stage: pre-push
    workflow: test
    setup: [python, partners, rust-molrs]
    run: uv run --project python --extra dev python -m pytest python/tests
  - id: build
    stage: pre-push
    workflow: test
    setup: [node]
    run: |
      npm run build:stage
      npm run build:stage-viewer && npm run build:sketch-viewer
      npm run check:pack
      npm run build:page
      npm run check:page-public-path
      npm run build:vsc-ext
  - id: docs
    stage: pre-push
    workflow: docs
    setup: [python, partners]
    run: uv run --project python --extra docs zensical build --strict
