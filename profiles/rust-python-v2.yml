name: rust-python-v2
schema: 2
global_inputs:
- .github/partners.env
- .github/**
- .pre-commit-config.yaml
- scripts/**
- .cargo/**
- Cargo.toml
- '**/Cargo.toml'
- Cargo.lock
- '**/Cargo.lock'
- '**/uv.lock'
- rust-toolchain.toml
- ruff.toml
- .python-version
environment:
- PATH
- LANG
- LC_ALL
- MACOSX_DEPLOYMENT_TARGET
- SDKROOT
- CPATH
- LIBRARY_PATH
- LD_LIBRARY_PATH
- SLURM_CLUSTER_NAME
- SLURM_JOB_PARTITION
- CFLAGS
- CPPFLAGS
- CXXFLAGS
- LDFLAGS
- AR
- FC
- NODE_OPTIONS
- WASM_BINDGEN_TEST_TIMEOUT
- PYO3_PYTHON
- PYO3_CROSS
- PYO3_CROSS_LIB_DIR
gates:
- id: workflows
  stage: pre-commit
  run: molci:workflows
  inputs:
  - .github/**
  depends_on: []
  tools: []
  always: true
- id: fmt
  stage: pre-commit
  run: scripts/check.sh fmt
  inputs:
  - '**/*.rs'
  - Cargo.toml
  - '**/Cargo.toml'
  depends_on: []
  tools:
  - - cargo
    - --version
  - - rustc
    - -vV
  - - rustfmt
    - --version
  always: true
- id: ruff
  stage: pre-commit
  run: scripts/check.sh ruff
  inputs:
  - '**/*.py'
  - '**/*.pyi'
  - ruff.toml
  - molpy/pyproject.toml
  depends_on: []
  tools:
  - - uv
    - --version
  - - uv
    - run
    - --no-project
    - --python
    - 3.12.12
    - python
    - --version
- id: os-cfg
  stage: pre-commit
  run: molci:os-cfg
  inputs:
  - '**/*.rs'
  depends_on: []
  tools: []
- id: partners
  stage: pre-commit
  run: scripts/check.sh partners
  inputs:
  - '**/Cargo.toml'
  - '**/pyproject.toml'
  depends_on: []
  tools:
  - - uv
    - --version
  - - uv
    - run
    - --no-project
    - --python
    - 3.12.12
    - python
    - --version
- id: clippy
  stage: pre-push
  run: scripts/check.sh clippy
  inputs:
  - crates/molrs/**
  - tests-data/**
  - crates/molrs-ffi/**
  - molc/**
  - molcxx/**
  - molpy/src/**
  - molwasm/**
  - molpy/build.rs
  depends_on: []
  tools:
  - - cargo
    - --version
  - - rustc
    - -vV
  - - clippy-driver
    - --version
- id: doc
  stage: pre-push
  run: scripts/check.sh doc
  inputs:
  - crates/molrs/**
  - tests-data/**
  depends_on: []
  tools:
  - - cargo
    - --version
  - - rustc
    - -vV
- id: test
  stage: pre-push
  run: scripts/check.sh test
  inputs:
  - crates/molrs/**
  - tests-data/**
  depends_on: []
  tools:
  - - cargo
    - --version
  - - rustc
    - -vV
  extra_inputs:
  - tests-data/**/*
- id: ffi
  stage: pre-push
  run: scripts/check.sh ffi
  inputs:
  - crates/molrs-ffi/**
  - crates/molrs/**
  - tests-data/**
  depends_on: []
  tools:
  - - cargo
    - --version
  - - rustc
    - -vV
- id: cxx
  stage: pre-push
  run: scripts/check.sh cxx
  inputs:
  - molcxx/**
  depends_on:
  - ffi
  tools:
  - - cargo
    - --version
  - - rustc
    - -vV
- id: capi
  stage: pre-push
  run: scripts/check.sh capi
  inputs:
  - molc/**
  depends_on:
  - ffi
  tools:
  - - cargo
    - --version
  - - rustc
    - -vV
  - - cmake
    - --version
  - - ctest
    - --version
- id: python
  stage: pre-push
  run: scripts/check.sh python
  inputs:
  - molpy/**
  depends_on:
  - ffi
  tools:
  - - cargo
    - --version
  - - rustc
    - -vV
  - - uv
    - --version
  - - uv
    - run
    - --no-project
    - --python
    - 3.12.12
    - python
    - --version
  produces:
  - '*.whl'
  extra_inputs:
  - tests-data/**/*
  - molpy/tests/tests-data/**/*
  artifact_directory: MOLPY_WHEEL_DIR
  artifact_environment: MOLPY_TESTED_WHEEL
- id: types
  stage: pre-push
  run: scripts/check.sh types
  inputs:
  - molpy/**
  depends_on:
  - python
  tools:
  - - uv
    - --version
  - - uv
    - run
    - --no-project
    - --python
    - 3.12.12
    - python
    - --version
- id: wasm
  stage: pre-push
  run: scripts/check.sh wasm
  inputs:
  - molwasm/**
  - crates/molrs/**
  - tests-data/**
  depends_on: []
  tools:
  - - cargo
    - --version
  - - rustc
    - -vV
  - - node
    - --version
  - - wasm-pack
    - --version
- id: mrec
  stage: pre-push
  run: scripts/check.sh mrec
  inputs:
  - molpy/**
  - scripts/ci-conformance.py
  depends_on:
  - python
  tools:
  - - uv
    - --version
  - - uv
    - run
    - --no-project
    - --python
    - 3.12.12
    - python
    - --version
- id: docs
  stage: pre-push
  run: scripts/check.sh docs
  inputs:
  - docs/**
  - zensical.toml
  - molpy/scripts/**
  depends_on:
  - python
  tools:
  - - uv
    - --version
  - - uv
    - run
    - --no-project
    - --python
    - 3.12.12
    - python
    - --version
- id: package-crate
  stage: pre-push
  run: scripts/check.sh package-crate
  inputs:
  - crates/molrs/**
  - LICENSE
  - README.md
  depends_on: []
  tools:
  - - cargo
    - --version
  - - rustc
    - -vV
- id: package-python
  stage: pre-push
  run: scripts/check.sh package-python
  inputs:
  - molpy/**
  - crates/molrs/**
  - crates/molrs-ffi/**
  depends_on:
  - python
  tools:
  - - cargo
    - --version
  - - rustc
    - -vV
  - - uv
    - --version
  - - uv
    - run
    - --no-project
    - --python
    - 3.12.12
    - python
    - --version
- id: package-wasm
  stage: pre-push
  run: scripts/check.sh package-wasm
  inputs:
  - molwasm/**
  - crates/molrs/**
  depends_on:
  - wasm
  tools:
  - - cargo
    - --version
  - - rustc
    - -vV
  - - node
    - --version
  - - wasm-pack
    - --version
  - - wasm-opt
    - --version
- id: measure-rust
  stage: measurement
  run: scripts/check.sh measure-rust
  inputs:
  - crates/molrs/**
  tools:
  - - cargo
    - --version
  - - rustc
    - -vV
  always: true
- id: measure-conformance
  stage: measurement
  run: scripts/check.sh mrec
  inputs:
  - molpy/**
  depends_on:
  - python
  tools:
  - - uv
    - --version
  env:
    MOLCI_CONFORMANCE_OUT: .ci-out/snapshots/conformance.json
    MOLCI_TRACK: 'true'
  always: true
platforms:
  linux:
    runner: ubuntu-latest
    gates:
    - workflows
    - test
    - ffi
    - cxx
    - capi
    - python
  windows:
    runner: windows-latest
    gates:
    - python
    - capi
  macos:
    runner: macos-latest
    gates:
    - python
    - cxx
  wasm:
    runner: ubuntu-latest
    gates:
    - wasm
  native:
    runner: ubuntu-latest
    all_native: true
