# Commit-time half of the CI gate.
#
# Every project-tool hook is `repo: local` + `language: system` running the
# exact command .github/workflows/ci.yml runs, so there is one invocation and
# no second pinned version to drift. They resolve from `pip install -e ".[dev]"`
# and `site/node_modules`.
#
# `npm run build` is here: measured at 6.8s, cheaper than the typecheck and
# half the cost of pytest. It was left out on an assumption that turned out
# to be wrong.

default_install_hook_types: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: python3 -m ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: python3 -m ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: pytest
        name: pytest
        entry: python3 -m pytest -q
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true

      - id: site-typecheck
        name: tsc --noEmit (site)
        entry: npm --prefix site run typecheck
        language: system
        files: ^site/(src/|tests/|tsconfig\.json|package\.json)
        pass_filenames: false
        require_serial: true

      - id: site-test
        name: rstest (site)
        entry: npm --prefix site test
        language: system
        files: ^site/(src/|tests/|rstest\.config\.ts|package\.json)
        pass_filenames: false
        require_serial: true

      - id: site-build
        name: rsbuild build (site)
        entry: npm --prefix site run build
        language: system
        files: ^(site/(src/|scripts/|public/|rsbuild\.config\.ts|package\.json)|data/)
        pass_filenames: false
        require_serial: true

      # Invariants a formatter and a type checker cannot see. Each one is
      # here because the thing it looks for already shipped and broke.
      - id: repo-invariants
        name: repository invariants
        entry: python3 scripts/check_repo.py
        language: system
        files: ^(\.github/workflows/|site/src/.*\.tsx$|scripts/check_repo\.py)
        pass_filenames: false
        require_serial: true
