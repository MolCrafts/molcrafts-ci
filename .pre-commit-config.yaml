# Commit hooks are cheap; pre-push runs every local gate, without file filters.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]

  - repo: local
    hooks:
      - id: lint
        name: static checks
        entry: uv run --locked --extra dev scripts/check.py lint
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: verify
        name: complete local CI gates
        entry: uv run --locked --extra dev scripts/check.py all
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
