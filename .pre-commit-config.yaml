# The checks of .github/ci.toml, by stage: `pre-commit` ones on every commit,
# `pre-push` ones before a push. CI runs all of them.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]

  - repo: local
    hooks:
      - id: molci-pre-commit
        name: molci check --stage pre-commit
        entry: uv run --locked --extra dev molci check --stage pre-commit
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: molci-pre-push
        name: molci check --stage pre-push
        entry: uv run --locked --extra dev molci check --stage pre-push
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
