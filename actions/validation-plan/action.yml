name: validation-plan
description: Select platform lanes from the authoritative gate registry
inputs:
  profile:
    description: Authoritative project gate profile
    default: rust-python
  native:
    description: Whether the independent native job covers the Linux lane
    required: true
outputs:
  matrix:
    description: Platform lane matrix
    value: ${{ steps.plan.outputs.matrix }}
runs:
  using: composite
  steps:
    - id: plan
      shell: bash
      env:
        NATIVE: ${{ inputs.native }}
        PROFILE: ${{ inputs.profile }}
      run: |
        uv run --no-project --with pyyaml==6.0.3 python - "$GITHUB_ACTION_PATH/../../profiles" >> "$GITHUB_OUTPUT" <<'PY'
        import json, os, re, sys, yaml
        from pathlib import Path
        name = os.environ["PROFILE"]
        assert re.fullmatch(r"[a-z0-9-]+", name), "invalid profile"
        profile = yaml.safe_load((Path(sys.argv[1]) / f"{name}.yml").read_text(encoding="utf-8"))
        excluded = {"native", "linux"} if os.environ["NATIVE"] == "true" else {"native"}
        rows = [{"lane": name, "os": spec["runner"]} for name, spec in profile["platforms"].items() if name not in excluded and not spec.get("manual")]
        assert rows, "no required platform lanes"
        print("matrix=" + json.dumps({"include": rows}))
        PY
