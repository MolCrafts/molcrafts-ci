name: run-gate
description: >
  Run one gate of a MolCrafts CI profile, or list the gates for a workflow
  area. The profile is a name (node-python, rust-python, python, node), not
  a commit SHA.
inputs:
  profile:
    description: Profile name
    required: true
  gate:
    description: Gate id to set up and run. Empty when listing.
    default: ""
  area:
    description: Workflow area (lint, test, docs). Set to list that area's gates.
    default: ""
outputs:
  gates:
    description: JSON array of gate ids for `area`
    value: ${{ steps.list.outputs.gates }}
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v10.2.0
    - if: inputs.area != ''
      id: list
      shell: bash
      env:
        PROFILE: ${{ inputs.profile }}
        AREA: ${{ inputs.area }}
      run: |
        set -euo pipefail
        gates=$(uv run --no-project --script "$GITHUB_ACTION_PATH/../../hooks/ci.py" --profile "$PROFILE" --area "$AREA" --list)
        echo "gates=$gates" >> "$GITHUB_OUTPUT"
    - if: inputs.gate != ''
      id: meta
      shell: bash
      env:
        PROFILE: ${{ inputs.profile }}
        GATE: ${{ inputs.gate }}
      run: |
        set -euo pipefail
        meta=$(uv run --no-project --script "$GITHUB_ACTION_PATH/../../hooks/ci.py" --profile "$PROFILE" --describe "$GATE")
        {
          echo "meta<<EOF"
          echo "$meta"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
    - if: inputs.gate != '' && contains(fromJSON(steps.meta.outputs.meta).setup, 'node')
      uses: MolCrafts/molcrafts-ci/actions/setup-node@master
    - if: inputs.gate != '' && contains(fromJSON(steps.meta.outputs.meta).setup, 'node-no-install')
      uses: MolCrafts/molcrafts-ci/actions/setup-node@master
      with:
        install: "false"
    - if: inputs.gate != '' && contains(fromJSON(steps.meta.outputs.meta).setup, 'pnpm')
      uses: MolCrafts/molcrafts-ci/actions/setup-node@master
      with:
        install: "false"
    - if: inputs.gate != '' && contains(fromJSON(steps.meta.outputs.meta).setup, 'pnpm')
      uses: pnpm/action-setup@v4
      with:
        run_install: true
    - if: inputs.gate != '' && contains(fromJSON(steps.meta.outputs.meta).setup, 'python')
      uses: MolCrafts/molcrafts-ci/actions/setup-python@master
    - if: inputs.gate != '' && contains(fromJSON(steps.meta.outputs.meta).setup, 'partners')
      uses: MolCrafts/molcrafts-ci/actions/setup-partners@master
    - if: inputs.gate != '' && contains(fromJSON(steps.meta.outputs.meta).setup, 'rust')
      uses: MolCrafts/molcrafts-ci/actions/setup-rust@master
    - if: inputs.gate != '' && contains(fromJSON(steps.meta.outputs.meta).setup, 'rust-molrs')
      uses: MolCrafts/molcrafts-ci/actions/setup-rust@master
      with:
        toolchain-dir: ../molrs
        cache: molrs-python
        workspaces: ../molrs/molrs-python -> target
    - if: inputs.gate != ''
      shell: bash
      env:
        PROFILE: ${{ inputs.profile }}
        GATE: ${{ inputs.gate }}
        MOLVIS_SKIP_UI_BUILD: "1"
      run: uv run --no-project --script "$GITHUB_ACTION_PATH/../../hooks/ci.py" --profile "$PROFILE" --gate "$GATE"
