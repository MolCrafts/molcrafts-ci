name: setup-partners
description: >
  Check out the partner repositories this one is built against. Shared by
  every MolCrafts repository as
  MolCrafts/molcrafts-ci/actions/setup-partners@master.

  Without `repository`: every partner .github/partners.env names, into
  ../<name> (the layout path dependencies expect), at the commit the
  repository's scripts/partners.py resolves -- the same resolver its git hooks
  use -- and its absolute path exported as <NAME>_DIR.

  With `repository`: fetch exactly `ref` into `path`. No caller branch or
  sibling checkout changes the selected dependency.
inputs:
  repository:
    description: One partner, owner/name; empty checks out every partner .github/partners.env names
    default: ""
  ref:
    description: Exact partner branch, tag or commit (with `repository`)
    default: dev
  path:
    description: Checkout directory, relative to the workspace (with `repository`)
    default: ""
runs:
  using: composite
  steps:
    - if: inputs.repository == ''
      shell: bash
      env:
        MOLCRAFTS_PARTNERS_ROOT: ${{ github.workspace }}
      run: python "$GITHUB_ACTION_PATH/../../src/molcrafts_ci/partners.py" fetch-all
    - if: inputs.repository != ''
      shell: bash
      env:
        MOLCRAFTS_PARTNERS_ROOT: ${{ github.workspace }}
        REPO: ${{ inputs.repository }}
        REF: ${{ inputs.ref }}
        DEST: ${{ inputs.path }}
      run: |
        [ -n "$DEST" ] || { echo "::error::setup-partners: 'repository' needs 'path'"; exit 1; }
        python "$GITHUB_ACTION_PATH/../../src/molcrafts_ci/partners.py" fetch-one "$REPO" "$REF" "$DEST"
