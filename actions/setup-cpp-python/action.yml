name: setup-cpp-python
description: Native prerequisites and compiler caches for the C++/Python profile
inputs:
  native:
    description: Whether this lane builds C++ in addition to the pure Python package
    default: 'true'
  scope:
    description: Build cache scope
    default: native
runs:
  using: composite
  steps:
    - if: runner.os == 'Linux' && inputs.native == 'true'
      shell: bash
      run: |
        set -euo pipefail
        packages=(libopenblas-pthread-dev libfftw3-dev ninja-build ccache)
        missing=()
        for package in "${packages[@]}"; do
          dpkg-query -W -f='${Status}' "$package" 2>/dev/null | grep -qx 'install ok installed' || missing+=("$package")
        done
        if [ "${#missing[@]}" -gt 0 ]; then
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 install -y --no-install-recommends "${missing[@]}"
        fi
    - if: runner.os == 'macOS' && inputs.native == 'true'
      shell: bash
      env:
        HOMEBREW_NO_AUTO_UPDATE: '1'
      run: |
        set -euo pipefail
        for package in libomp openblas fftw ninja ccache; do
          brew list --versions "$package" >/dev/null || brew install "$package"
        done
    - id: environment
      shell: bash
      env:
        NATIVE: ${{ inputs.native }}
      run: |
        set -euo pipefail
        bin=$(bash "$GITHUB_ACTION_PATH/../setup-molci/install.sh" "$RUNNER_TEMP/molci")
        python="$bin/python"
        [ -x "$python" ] || python="$bin/python.exe"
        "$python" - >> "$GITHUB_OUTPUT" <<'PY'
        import os
        from pathlib import Path
        from molcrafts_ci.validation import Runner, digest, profile
        root = Path.cwd()
        config = profile(root)
        runner = Runner(root, config)
        tools = config["cache_tools" if os.environ["NATIVE"] == "true" else "package_cache_tools"]
        runner.key({"id": "build-environment", "tools": tools})
        print("identity=" + digest(runner.tools))
        PY
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: |
          build/molci
          !build/molci/ccache/**
          build/ci-partners
        key: cpp-${{ runner.os }}-${{ runner.arch }}-${{ inputs.scope }}-${{ steps.environment.outputs.identity }}-${{ hashFiles('rust-toolchain.toml', 'python/uv.lock', '.github/partners.env') }}-${{ github.sha }}
        restore-keys: |
          cpp-${{ runner.os }}-${{ runner.arch }}-${{ inputs.scope }}-${{ steps.environment.outputs.identity }}-${{ hashFiles('rust-toolchain.toml', 'python/uv.lock', '.github/partners.env') }}-
    # ccache checks each compile's source, headers and arguments itself. Keep
    # those objects across CI/dependency pin updates; never restore receipts.
    - if: inputs.native == 'true'
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: build/molci/ccache
        key: cpp-ccache-${{ runner.os }}-${{ runner.arch }}-${{ steps.environment.outputs.identity }}-${{ github.sha }}
        restore-keys: |
          cpp-ccache-${{ runner.os }}-${{ runner.arch }}-${{ steps.environment.outputs.identity }}-
    - shell: bash
      run: |
        echo "CCACHE_DIR=$GITHUB_WORKSPACE/build/molci/ccache" >> "$GITHUB_ENV"
        echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
