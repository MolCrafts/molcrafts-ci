name: setup-molci
description: >
  Put `molci` on PATH, installed from this same molcrafts-ci checkout, so the
  CLI is exactly the version of the workflow or Action that called it.
outputs:
  bin:
    description: Directory holding molci
    value: ${{ steps.install.outputs.bin }}
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v10.2.0
    - id: install
      shell: bash
      run: |
        bin=$(bash "$GITHUB_ACTION_PATH/install.sh" "$RUNNER_TEMP/molci")
        echo "$bin" >> "$GITHUB_PATH"
        echo "bin=$bin" >> "$GITHUB_OUTPUT"
