name: release-verify
description: Require completed upstream master verification of the exact release commit
inputs:
  publish:
    description: Context publication permission; false is a dry run
    required: true
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
    - shell: bash
      env:
        PUBLISH: ${{ inputs.publish }}
      run: uv run --no-project --with pyyaml==6.0.3 python "$GITHUB_ACTION_PATH/verify.py"
