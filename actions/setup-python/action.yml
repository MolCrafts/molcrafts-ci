name: setup-python
description: >
  Python on PATH, and uv with its cache. Shared by every MolCrafts repository
  as MolCrafts/molcrafts-ci/actions/setup-python@master.
inputs:
  python-version:
    description: Python on PATH (uv calls name their own with --python)
    default: "3.12"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: ${{ inputs.python-version }}
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
