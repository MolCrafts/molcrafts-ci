name: docs

# The site exactly as Cloudflare Pages builds it (root `site`, `npm run
# build`). Cloudflare Pages deploys it from MolCrafts itself, on its own
# webhook, so no job here deploys.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

permissions:
  contents: read

# One group per file, workflow, event and ref; only a feature ref cancels its
# superseded runs. The canonical block: actions/check-workflows.
concurrency:
  group: docs-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(fromJSON('["refs/heads/dev","refs/heads/master"]'), github.ref) && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Where this run happens, decided once: ./actions/ci-context.
  context:
    name: docs / context
    uses: ./.github/workflows/context.yml

  build:
    name: docs / build
    needs: context
    # A pull request whose head commit its push already ran in full (inside
    # a fork, or upstream from dev/master) is skipped.
    if: needs.context.outputs.skip-pr != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./actions/setup-node
        with:
          working-directory: site
      - run: npm run build
        working-directory: site
