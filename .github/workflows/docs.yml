name: docs

# The site exactly as Cloudflare Pages builds it (root `site`, `npm run
# build`). Cloudflare Pages deploys it from MolCrafts itself, on its own
# webhook, so no job here deploys.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [dev, master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' }}

jobs:
  site:
    name: docs / site
    # A pull request inside a fork was already built by its push.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || github.repository_owner == 'MolCrafts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
        with:
          working-directory: site
      - run: npm run build
        working-directory: site
