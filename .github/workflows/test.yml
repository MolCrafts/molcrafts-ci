name: test

# Two tiers (`test / context` decides, through ./actions/ci-context):
#
#   fast  a feature-branch push to MolCrafts: Python 3.12, the site tests and
#         the shared actions.
#   full  every push to a fork (proven before its pull request), dev, master
#         and main on MolCrafts, pull requests, tags and dispatches:
#         + Python 3.13.
#
# Upstream only, `test / python (3.12)` also publishes this run's tests and
# coverage through ./actions/submit: molcrafts-ci is its own first producer.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [dev, master, main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# One group per file, workflow, event and ref. Under workflow_call (release.yml
# running lint/test) github.workflow and github.event_name are the caller's, so
# a called run never shares, and so never cancels, a direct run's group.
concurrency:
  group: test-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(fromJSON('["refs/heads/dev","refs/heads/master","refs/heads/main"]'), github.ref) && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Where this run happens, decided once (./actions/ci-context). Every other
  # MolCrafts repository runs the same job from
  # MolCrafts/molcrafts-ci/actions/ci-context@master; this one runs its own
  # checkout, so a change to the rules is exercised before anyone follows it.
  context:
    name: test / context
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.context.outputs.tier }}
      upstream: ${{ steps.context.outputs.upstream }}
      integration: ${{ steps.context.outputs.integration }}
      skip-pr: ${{ steps.context.outputs.skip-pr }}
      publish: ${{ steps.context.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: actions/ci-context
      - id: context
        uses: ./actions/ci-context

  python:
    name: test / python (${{ matrix.python }})
    needs: context
    if: needs.context.outputs.skip-pr != 'true'
    runs-on: ubuntu-latest
    permissions:
      # The publish steps push this run's tests and coverage into data/. Same
      # repository, so GITHUB_TOKEN is the right credential -- and since GitHub
      # does not start a workflow from a GITHUB_TOKEN push, it is also what
      # keeps the ingest commit from triggering another run. Cloudflare Pages
      # builds from its own webhook, so the site still redeploys.
      contents: write
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.context.outputs.tier == 'full' && '["3.12","3.13"]' || '["3.12"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./actions/setup-python
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra dev
      # One run is both the gate and the measurement.
      - run: >-
          uv run --locked --extra dev python -m pytest -q --junitxml=.ci-out/junit.xml
          --cov=molcrafts_ci --cov-branch --cov-report=json:.ci-out/coverage.json
      # The run's numbers in its summary, from this checkout's actions/report:
      # every MolCrafts test job runs the same step @master.
      - name: Report
        if: ${{ !cancelled() }}
        uses: ./actions/report
        with:
          title: test / python (${{ matrix.python }})
          junit: .ci-out/junit.xml
          coverage: .ci-out/coverage.json

      # These run even when the gate failed: a run whose tests went red is
      # exactly the run whose test record is worth keeping. The gate has
      # already decided the job's verdict.
      - name: Build snapshots
        if: ${{ !cancelled() && needs.context.outputs.upstream == 'true' && matrix.python == '3.12' && hashFiles('.ci-out/junit.xml') != '' }}
        # Only a push to master becomes project history; anything else
        # produces the same snapshots untracked, which submit validates and
        # uploads without publishing.
        run: |
          uv run --locked --extra dev molci snapshot \
            --out .ci-out/snapshots \
            --junit .ci-out/junit.xml \
            --coverage .ci-out/coverage.json \
            ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') && '--track' || '' }}
      - name: Publish to the index
        if: ${{ !cancelled() && needs.context.outputs.upstream == 'true' && matrix.python == '3.12' && hashFiles('.ci-out/snapshots/*.json') != '' }}
        uses: ./actions/submit
        with:
          snapshot-path: .ci-out/snapshots/*.json
          project: molcrafts-ci
          artifact-name: molcrafts-ci-self-snapshot
          # Writing to its own repository is the one case GITHUB_TOKEN covers.
          token: ${{ github.token }}

  site:
    name: test / site
    needs: context
    if: needs.context.outputs.skip-pr != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./actions/setup-node
        with:
          working-directory: site
      - run: npm run verify:design
        working-directory: site
      - run: npm test
        working-directory: site
      - run: npx playwright install --with-deps chromium
        working-directory: site
      - run: npm run test:browser
        working-directory: site

  # The shared setup actions every MolCrafts repository uses, from this
  # checkout: each one run once, so a broken action fails here before any
  # repository picks it up from master.
  actions:
    name: test / actions
    needs: context
    if: needs.context.outputs.skip-pr != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./actions/setup-python
        with:
          python-version: "3.13"
      - run: python --version | grep -F 3.13 && uv --version
      - uses: ./actions/setup-node
        with:
          working-directory: site
      - run: node --version && test -d site/node_modules
      - run: |
          mkdir -p .ci-out/rust
          printf '[toolchain]\nchannel = "stable"\nprofile = "minimal"\n' > .ci-out/rust/rust-toolchain.toml
      - uses: ./actions/setup-rust
        with:
          toolchain-dir: .ci-out/rust
          components: clippy
          targets: wasm32-unknown-unknown
      - run: |
          cd .ci-out/rust
          cargo --version && cargo clippy --version
          rustup target list --installed | grep -Fx wasm32-unknown-unknown
      - uses: ./actions/setup-partners
        with:
          repository: MolCrafts/molrec
          ref: 72fd70fcf4984cc8d49f6e508a25f5c7575694c9
          path: .ci-out/molrec
      # A fixed fixture repository: runner context must not change its ref.
      - run: git -C .ci-out/molrec log -1 --oneline && test -f .ci-out/molrec/pyproject.toml

  # ./actions/report on every OS a MolCrafts test job runs on, against the
  # unit-test fixtures: the table must land in the step summary (the action
  # itself never fails, so this job is what notices it stopped working).
  report:
    name: test / report (${{ matrix.os }})
    needs: context
    if: needs.context.outputs.skip-pr != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./actions/setup-python
      - id: pytest
        uses: ./actions/report
        with:
          title: fixtures (pytest)
          junit: tests/fixtures/report/pytest.xml
          coverage: tests/fixtures/report/coverage-py.json
      - id: cargo
        uses: ./actions/report
        with:
          title: fixtures (cargo)
          cargo-test: tests/fixtures/report/cargo-test.log
          coverage: tests/fixtures/report/lcov.info
          coverage-format: lcov
      # Each step has its own summary file, so the check reads the output.
      - env:
          PYTEST: ${{ steps.pytest.outputs.table }}
          CARGO: ${{ steps.cargo.outputs.table }}
        run: |
          grep -Fx '| 14 | 3 | 3 | 75.0% | 62.5% |' <<< "$PYTEST"
          grep -Fx '| 14 | 1 | 2 | 75.0% | — |' <<< "$CARGO"

  # Synthetic contexts run in pytest, without starting a hosted job per case.
  # One live call verifies the action input/output wiring against GitHub.
  ci-context:
    name: test / ci-context
    needs: context
    if: needs.context.outputs.skip-pr != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: actions/ci-context
      # No inputs: the defaults are this run's github context, and the
      # outputs must agree with the expressions every workflow inlined
      # before ci-context existed (spec Revision 2), and `publish` with its
      # definition (Revision 4).
      - id: live
        uses: ./actions/ci-context
      - env:
          GOT: ${{ toJSON(steps.live.outputs) }}
          WANT_TIER: ${{ (github.repository_owner != 'MolCrafts' || contains(fromJSON('["dev","master","main"]'), github.ref_name) || github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')) && 'full' || 'fast' }}
          WANT_UPSTREAM: ${{ github.repository_owner == 'MolCrafts' }}
          WANT_RUN: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || github.repository_owner == 'MolCrafts' }}
          # The canonical feature-ref expression of every workflow-level
          # concurrency block (actions/check-workflows): integration is its
          # negation.
          WANT_CANCEL: ${{ !contains(fromJSON('["refs/heads/dev","refs/heads/master","refs/heads/main"]'), github.ref) && !startsWith(github.ref, 'refs/tags/') }}
          WANT_PUBLISH: ${{ github.repository_owner == 'MolCrafts' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        run: |
          python3 - <<'PY'
          import json, os
          got = json.loads(os.environ["GOT"])
          e = os.environ
          want = {
              "tier": e["WANT_TIER"],
              "upstream": e["WANT_UPSTREAM"],
              "skip-pr": "false" if e["WANT_RUN"] == "true" else "true",
              "integration": "false" if e["WANT_CANCEL"] == "true" else "true",
              "publish": e["WANT_PUBLISH"],
          }
          assert got == want, f"got {got}, want {want}"
          print(got)
          PY
