name: test

# Two tiers (`test / tier` decides):
#
#   fast  a feature-branch push to MolCrafts: Python 3.12, the site tests and
#         the shared actions.
#   full  every push to a fork (proven before its pull request), dev, master
#         and main on MolCrafts, pull requests, tags and dispatches:
#         + Python 3.13.
#
# Upstream only, `test / python (3.12)` also publishes this run's tests and
# coverage through ./actions/submit: molcrafts-ci is its own first producer.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [dev, master, main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# One group per file, workflow, event and ref. Under workflow_call (release.yml
# running lint/test) github.workflow and github.event_name are the caller's, so
# a called run never shares, and so never cancels, a direct run's group.
concurrency:
  group: test-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(fromJSON('["refs/heads/dev","refs/heads/master","refs/heads/main"]'), github.ref) && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  tier:
    name: test / tier
    # A pull request inside a fork was already run, full tier, by its push.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || github.repository_owner == 'MolCrafts'
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.tier.outputs.full }}
    steps:
      - id: tier
        run: echo "full=${{ github.repository_owner != 'MolCrafts' || contains(fromJSON('["dev","master","main"]'), github.ref_name) || github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') }}" | tee -a "$GITHUB_OUTPUT"

  python:
    name: test / python (${{ matrix.python }})
    needs: tier
    runs-on: ubuntu-latest
    permissions:
      # The publish steps push this run's tests and coverage into data/. Same
      # repository, so GITHUB_TOKEN is the right credential -- and since GitHub
      # does not start a workflow from a GITHUB_TOKEN push, it is also what
      # keeps the ingest commit from triggering another run. Cloudflare Pages
      # builds from its own webhook, so the site still redeploys.
      contents: write
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.tier.outputs.full == 'true' && '["3.12","3.13"]' || '["3.12"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./actions/setup-python
        with:
          python-version: ${{ matrix.python }}
      - run: uv pip install --system -e ".[dev]"
      # One run is both the gate and the measurement.
      - run: >-
          pytest -q --junitxml=.ci-out/junit.xml
          --cov=molcrafts_ci --cov-branch --cov-report=json:.ci-out/coverage.json

      # These run even when the gate failed: a run whose tests went red is
      # exactly the run whose test record is worth keeping. The gate has
      # already decided the job's verdict.
      - name: Build snapshots
        if: ${{ !cancelled() && github.repository_owner == 'MolCrafts' && matrix.python == '3.12' && hashFiles('.ci-out/junit.xml') != '' }}
        # Only a push to master becomes project history; anything else
        # produces the same snapshots untracked, which submit validates and
        # uploads without publishing.
        run: |
          molci snapshot \
            --out .ci-out/snapshots \
            --junit .ci-out/junit.xml \
            --coverage .ci-out/coverage.json \
            ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') && '--track' || '' }}
      - name: Publish to the index
        if: ${{ !cancelled() && github.repository_owner == 'MolCrafts' && matrix.python == '3.12' && hashFiles('.ci-out/snapshots/*.json') != '' }}
        uses: ./actions/submit
        with:
          snapshot-path: .ci-out/snapshots/*.json
          project: molcrafts-ci
          artifact-name: molcrafts-ci-self-snapshot
          # Writing to its own repository is the one case GITHUB_TOKEN covers.
          token: ${{ github.token }}

  site:
    name: test / site
    needs: tier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./actions/setup-node
        with:
          working-directory: site
      - run: npm test
        working-directory: site

  # The shared setup actions every MolCrafts repository uses, from this
  # checkout: each one run once, so a broken action fails here before any
  # repository picks it up from master.
  actions:
    name: test / actions
    needs: tier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./actions/setup-python
        with:
          python-version: "3.13"
      - run: python --version | grep -F 3.13 && uv --version
      - uses: ./actions/setup-node
        with:
          working-directory: site
      - run: node --version && test -d site/node_modules
      - run: |
          mkdir -p .ci-out/rust
          printf '[toolchain]\nchannel = "stable"\nprofile = "minimal"\n' > .ci-out/rust/rust-toolchain.toml
      - uses: ./actions/setup-rust
        with:
          toolchain-dir: .ci-out/rust
          components: clippy
          targets: wasm32-unknown-unknown
      - run: |
          cd .ci-out/rust
          cargo --version && cargo clippy --version
          rustup target list --installed | grep -Fx wasm32-unknown-unknown
      - uses: ./actions/setup-partners
        with:
          repository: MolCrafts/molrec
          path: .ci-out/molrec
      # Any branch of molrec: on master this follows molrec's master (the
      # same-named branch), elsewhere its dev.
      - run: git -C .ci-out/molrec log -1 --oneline && test -f .ci-out/molrec/pyproject.toml
