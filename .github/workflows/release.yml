# Tag-triggered release to PyPI via trusted publishing.
#
# No API token lives in this repository: PyPI verifies a short-lived OIDC
# token minted by GitHub for this exact workflow. That binding is configured
# once on PyPI (see the checklist in CHANGELOG.md).
name: Release

# A workflow_dispatch is a dry run: the same gates and the build, no upload.
# Uploading needs a v* tag on MolCrafts itself.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python
      - run: uv pip install --system -e ".[dev]"

      # A tag that disagrees with pyproject would publish a version nobody
      # asked for, under a name nobody can reproduce from the tree.
      - name: Tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $pkg"
            exit 1
          fi
          echo "releasing $pkg"

      # The same checks lint.yml and test.yml run; a tag must not skip them.
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: pytest -q

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
        with:
          working-directory: site
      - run: npm run typecheck
        working-directory: site
      - run: npm test
        working-directory: site

  build:
    needs: [verify, site]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: github.repository_owner == 'MolCrafts' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/molcrafts-ci
    permissions:
      id-token: write # the OIDC token PyPI trades for an upload
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    if: github.repository_owner == 'MolCrafts' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
