name: release

# A `v*` tag on MolCrafts/molcrafts-ci: guard -> lint + the full test tier ->
# build -> PyPI (trusted publishing: no API token lives in this repository;
# PyPI trusts a short-lived OIDC token GitHub mints for this exact file, see
# the checklist in CHANGELOG.md) -> GitHub Release.
#
# A dispatch is the dry run, on any branch, fork or upstream: the same gates
# and the build, no upload. Only a `v*` tag pushed to MolCrafts uploads
# (`needs.context.outputs.publish`).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# One group per file, workflow, event and ref; a release is never cancelled.
# The canonical block: actions/check-workflows.
concurrency:
  group: release-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Where this run happens, decided once: ./actions/ci-context.
  context:
    name: release / context
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.context.outputs.tier }}
      upstream: ${{ steps.context.outputs.upstream }}
      integration: ${{ steps.context.outputs.integration }}
      skip-pr: ${{ steps.context.outputs.skip-pr }}
      publish: ${{ steps.context.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: actions/ci-context
      - id: context
        uses: ./actions/ci-context

  guard:
    name: release / guard
    needs: context
    if: github.event_name == 'workflow_dispatch' || needs.context.outputs.upstream == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # A tag that disagrees with pyproject would publish a version nobody
      # asked for, under a name nobody can reproduce from the tree.
      - name: The tag is the package version
        if: github.event_name == 'push'
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "::error::tag $GITHUB_REF_NAME is not v$version"; exit 1; }

  lint:
    needs: guard
    uses: ./.github/workflows/lint.yml

  test:
    needs: guard
    uses: ./.github/workflows/test.yml
    # test / python publishes its own snapshot (contents: write on itself).
    permissions:
      contents: write

  build:
    name: release / build
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./actions/setup-python
      - run: uv build
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    name: release / pypi
    needs: [context, build]
    # A `v*` tag on MolCrafts, and nothing else: actions/ci-context decides.
    if: needs.context.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # the OIDC token PyPI trades for an upload
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  github:
    name: release / github
    needs: [context, pypi]
    if: needs.context.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
