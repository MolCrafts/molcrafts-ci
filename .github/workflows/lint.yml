name: lint

# Format, linters and static checks; the same jobs in every context. The
# commit-time half of these lives in .pre-commit-config.yaml.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [dev, master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' }}

jobs:
  python:
    name: lint / python
    # A pull request inside a fork was already built by its push.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || github.repository_owner == 'MolCrafts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python
      - run: uv pip install --system -e ".[dev]" pyyaml
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      # Invariants a formatter and a type checker cannot see.
      - run: python scripts/check_repo.py

  site:
    name: lint / site
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || github.repository_owner == 'MolCrafts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
        with:
          working-directory: site
      # rsbuild does not type-check, so a clean `docs / site` build says
      # nothing about types. This is the only place tsc runs.
      - run: npm run typecheck
        working-directory: site
