name: lint

# Format, linters and static checks; the same jobs in every context. The
# commit-time half of these lives in .pre-commit-config.yaml.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [dev, master]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# One group per file, workflow, event and ref. Under workflow_call (release.yml
# running lint/test) github.workflow and github.event_name are the caller's, so
# a called run never shares, and so never cancels, a direct run's group.
concurrency:
  group: lint-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(fromJSON('["refs/heads/dev","refs/heads/master"]'), github.ref) && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Where this run happens, decided once: ./actions/ci-context.
  context:
    name: lint / context
    uses: ./.github/workflows/context.yml

  python:
    name: lint / python
    needs: context
    # A pull request whose head commit its push already ran in full (inside
    # a fork, or upstream from dev/master) is skipped.
    if: needs.context.outputs.skip-pr != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./actions/setup-python
      - run: uv sync --locked --extra dev
      - run: uv run --locked --extra dev scripts/check.py dependencies lint

  site:
    name: lint / site
    needs: context
    if: needs.context.outputs.skip-pr != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./actions/setup-node
        with:
          working-directory: site
      # rsbuild does not type-check, so a clean `docs / build` says nothing
      # about types. This is the only place tsc runs.
      - run: npm run typecheck
        working-directory: site

  # Every workflow through actionlint, and every shared composite action's
  # action.yml against the action metadata schema: an invalid action.yml
  # breaks every repository that uses it, at their next run, not here.
  actions:
    name: lint / actions
    needs: context
    if: needs.context.outputs.skip-pr != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./actions/setup-python
      - run: uv run --locked --extra dev python -m check_jsonschema --builtin-schema vendor.github-actions actions/*/action.yml
      - run: uv run --locked --extra dev python -m check_jsonschema --builtin-schema vendor.github-workflows .github/workflows/*.yml
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
