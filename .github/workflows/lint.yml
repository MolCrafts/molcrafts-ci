name: lint

# Format, linters and static checks; the same jobs in every context. The
# commit-time half of these lives in .pre-commit-config.yaml.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [dev, master, main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# One group per file, workflow, event and ref. Under workflow_call (release.yml
# running lint/test) github.workflow and github.event_name are the caller's, so
# a called run never shares, and so never cancels, a direct run's group.
concurrency:
  group: lint-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(fromJSON('["refs/heads/dev","refs/heads/master","refs/heads/main"]'), github.ref) && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  python:
    name: lint / python
    # A pull request inside a fork was already run by its push.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || github.repository_owner == 'MolCrafts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./actions/setup-python
      - run: uv pip install --system -e ".[dev]" pyyaml
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      # Invariants a formatter and a type checker cannot see.
      - run: python scripts/check_repo.py

  site:
    name: lint / site
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || github.repository_owner == 'MolCrafts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./actions/setup-node
        with:
          working-directory: site
      # rsbuild does not type-check, so a clean `docs / build` says nothing
      # about types. This is the only place tsc runs.
      - run: npm run typecheck
        working-directory: site

  # Every workflow through actionlint, and every shared composite action's
  # action.yml against the action metadata schema: an invalid action.yml
  # breaks every repository that uses it, at their next run, not here.
  actions:
    name: lint / actions
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || github.repository_owner == 'MolCrafts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./actions/setup-python
      - run: uvx check-jsonschema --builtin-schema vendor.github-actions actions/*/action.yml
      - run: uvx check-jsonschema --builtin-schema vendor.github-workflows .github/workflows/*.yml
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
