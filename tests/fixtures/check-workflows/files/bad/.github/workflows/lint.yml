name: lint

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [dev, master]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(fromJSON('["refs/heads/dev","refs/heads/master"]'), github.ref) && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  context:
    name: lint
    uses: MolCrafts/molcrafts-ci/.github/workflows/context.yml@master

  python:
    name: lint / python
    needs: context
    if: needs.context.outputs.skip-pr != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo ok
