name: library

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: library-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(fromJSON('["refs/heads/dev","refs/heads/master"]'), github.ref) && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  context:
    name: library
    uses: MolCrafts/molcrafts-ci/.github/workflows/context.yml@master

  unit:
    name: library / unit
    needs: context
    if: needs.context.outputs.skip-pr != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo ok
