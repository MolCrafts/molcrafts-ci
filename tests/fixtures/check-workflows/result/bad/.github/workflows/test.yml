name: test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [dev, master]

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(fromJSON('["refs/heads/dev","refs/heads/master"]'), github.ref) && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  context:
    name: test
    uses: MolCrafts/molcrafts-ci/.github/workflows/context.yml@master

  unit:
    name: test / unit
    needs: context
    if: needs.context.outputs.skip-pr != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo ok

  result:
    name: test / gate
    needs: [context]
    runs-on: ubuntu-latest
    steps:
      - run: echo done
