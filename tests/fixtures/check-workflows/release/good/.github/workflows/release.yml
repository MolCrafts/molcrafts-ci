name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  context:
    name: release
    uses: MolCrafts/molcrafts-ci/.github/workflows/context.yml@master

  pypi:
    name: release / pypi
    needs: context
    if: needs.context.outputs.publish == 'true'
    environment: pypi
    runs-on: ubuntu-latest
    steps:
      - uses: pypa/gh-action-pypi-publish@release/v1

  github:
    name: release / github
    needs: context
    if: needs.context.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v2
