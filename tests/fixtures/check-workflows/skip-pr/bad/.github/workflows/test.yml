name: test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [dev, master, main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(fromJSON('["refs/heads/dev","refs/heads/master","refs/heads/main"]'), github.ref) && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  context:
    name: test / context
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.context.outputs.tier }}
      upstream: ${{ steps.context.outputs.upstream }}
      integration: ${{ steps.context.outputs.integration }}
      skip-pr: ${{ steps.context.outputs.skip-pr }}
      publish: ${{ steps.context.outputs.publish }}
    steps:
      - id: context
        uses: MolCrafts/molcrafts-ci/actions/ci-context@master

  rust:
    name: test / rust
    needs: context
    if: needs.context.outputs.skip-pr != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo ok

  full:
    name: test / full
    needs: context
    if: needs.context.outputs.tier == 'full'
    runs-on: ubuntu-latest
    steps:
      - run: echo ok

  either:
    name: test / either
    needs: context
    if: needs.context.outputs.skip-pr != 'true' || needs.context.outputs.upstream == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo ok

  report:
    name: test / report
    needs: [context, rust]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - run: echo ok

  summary:
    name: test / summary
    needs: [context, rust]
    if: "!cancelled()"
    runs-on: ubuntu-latest
    steps:
      - run: echo ok
